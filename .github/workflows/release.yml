name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      release_version:
        description: Semantic release tag to build and publish
        required: true
        type: string
    secrets:
      SPARKLE_PUBLIC_KEY:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
      DEVELOPMENT_TEAM: HT7R9CG7ZN
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_version || github.ref }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate update-signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project MacSweep.xcodeproj -scheme MacSweep -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build, ad-hoc sign, and package
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          ./scripts/release.sh

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          gh release create "$RELEASE_VERSION" \
            "build/Release/MacSweep-$VERSION.dmg" \
            "build/Release/MacSweep-$VERSION.zip" \
            "build/Release/appcast.xml" \
            "build/Release/SHA256SUMS.txt" \
            --verify-tag \
            --title "MacSweep $RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/macsweep-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
